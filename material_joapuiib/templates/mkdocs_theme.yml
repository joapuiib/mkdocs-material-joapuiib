extends: materialx

language: ca

cover:
  logo: 'img/cover/cipfp-mislata.svg'
  background: false

under_construction: false

code:
  fold:
    enabled: true
    lines: 0

features:
  - announce.dismiss
  - content.code.copy
  - content.code.annotate
  - content.footnote.tooltips
  - content.tabs.link
  - content.tooltips
  - navigation.top
  - navigation.footer
  - navigation.indexes
  - navigation.instant
  - navigation.tabs
  - navigation.path
  - toc.follow


# Interface icons (Lucide). Keys missing from the site's `theme.icon` are
# filled in from `partials/icon-defaults.html`, so setting e.g. only
# `theme.icon.logo` keeps the rest.
icon: {}

topbar_style: glass

# Palette toggle for light mode
palette:
  - media: "(prefers-color-scheme: light)"
    scheme: default
    toggle:
      # icon: lucide/toggle-right
      icon: lucide/sun
      name: Switch to dark mode

  # Palette toggle for dark mode
  - media: "(prefers-color-scheme: dark)"
    scheme: slate
    toggle:
      # icon: lucide/toggle-left
      icon: lucide/moon
      name: Switch to light mode

# Link for the author name in the footer copyright notice
author_link: null

license:
  type: "CC BY-NC-SA 4.0"
  text: "(Reconeixement - NoComercial - CompartirIgual) &#x1f16d;"
  link: https://creativecommons.org/licenses/by-nc-sa/4.0/deed.ca
  image: img/license/by-nc-sa.png
